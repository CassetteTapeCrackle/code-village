# A task requires lambda, which no lesson teaches.
base = "good"
expect = ["required-untaught"]

[[file]]
path = "features.toml"
text = '''
[feature.fn-print]
summary = "print()"
detect = ["call:print"]

[feature.function-def]
summary = "def"
detect = ["node:FunctionDef"]

[feature.return-statement]
summary = "return"
detect = ["node:Return"]

[feature.fn-sum]
summary = "sum()"
detect = ["call:sum"]

[feature.lambda]
summary = "lambda expressions"
detect = ["node:Lambda"]
words = ["lambda"]
say = "use a lambda"
'''

[[file]]
path = "w1/a/basics/tasks/double/task.toml"
text = '''
requires = ["lambda"]
id = "basics-double"
concept = "numbers"
kind = "write"
title = "Double it"
prompt = "Write `double(n)` as a lambda."
hints = ["Multiply by 2."]
gotcha = true

strict = true

[cases]
call = "double"
args = ["int -50..50"]
'''
