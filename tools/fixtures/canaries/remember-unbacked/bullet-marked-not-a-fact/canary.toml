# A remember bullet is marked not-a-fact, so nothing backs what learners revise from.
base = "good"
expect = ["remember-unbacked"]

[[file]]
path = "w1/a/basics/ledger.toml"
text = '''
[[sentence]]
fp = "5200066b97e8"
text = "Numbers can be multiplied."
where = "text:0"
status = "claim:times-two"

