[cases]
call = "mul"
args = ["int -50..50", "int -50..50"]
'''

[[file]]
path = "w1/a/boss/stages/2-mul/tests.py"
text = '''
def test_mul():
    expect_equal(learner["mul"](4, 3), 12, "mul(4, 3)")
'''

[[delete]]
path = "w1/a/boss/stages/3-mul"
