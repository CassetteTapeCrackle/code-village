# Without hidden cases, `n < 0` changed to `n <= 0` or `n < 1` survives every test (both give 0 at n = 0). Someone
# checked them by hand and listed them under `equivalent`, so neither is a finding.
base = "good"
expect = []

[[file]]
path = "w1/a/basics/tasks/triple/solution.py"
text = '''
def triple(n):
    if n < 0:
        return 0
    return n * 3
'''

[[file]]
path = "w1/a/basics/tasks/triple/tests.py"
text = '''
def test_positive():
    expect_equal(learner["triple"](2), 6, "triple(2)")

def test_negative():
    expect_equal(learner["triple"](-2), 0, "triple(-2)")

def test_minus_one():
    expect_equal(learner["triple"](-1), 0, "triple(-1)")
'''

[[file]]
path = "w1/a/basics/tasks/triple/right/added-three-times.py"
text = '''
def triple(n):
    return max(n, 0) * 3
'''

