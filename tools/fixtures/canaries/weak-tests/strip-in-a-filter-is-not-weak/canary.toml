# The only strip is a filter: strip, lstrip and rstrip are empty for the same strings, so swapping them changes
# nothing. The task declares no [cases], so no fuzz set could clear a survivor: the mutant must not exist at all.
base = "good"
expect = []

[[file]]
path = "w1/a/basics/tasks/double/solution.py"
text = '''
def double(n):
    kept = [p for p in str(n).split(",") if p.strip()]
    return int("".join(kept)) * 2
'''

