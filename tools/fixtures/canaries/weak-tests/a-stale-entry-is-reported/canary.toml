[[file]]
path = "w1/a/basics/tasks/triple/solution.py"
text = '''
def triple(n):
    if n < 0:
        return 0
    return n * 3
'''

[[file]]
path = "w1/a/basics/tasks/triple/tests.py"
text = '''
def test_positive():
    expect_equal(learner["triple"](2), 6, "triple(2)")

def test_negative():
    expect_equal(learner["triple"](-2), 0, "triple(-2)")

def test_minus_one():
    expect_equal(learner["triple"](-1), 0, "triple(-1)")
'''

[[file]]
