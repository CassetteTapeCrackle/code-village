# The quadruple prompt asks for a docstring, which no test or detector verifies.
base = "good"
expect = ["prompt-asks-construct"]

[[file]]
path = "w1/a/basics/tasks/double/variants/quadruple/variant.toml"
text = '''
id = "basics-double-quadruple"
title = "Four times"
prompt = "Write `quadruple(n)` and explain it in a docstring."

[cases]
call = "quadruple"
args = ["int -50..50"]
'''

[[file]]
path = "w1/a/basics/tasks/double/variants/quadruple/solution.py"
text = '''
def quadruple(n):
    """Return n times four."""
    return n * 4
'''

