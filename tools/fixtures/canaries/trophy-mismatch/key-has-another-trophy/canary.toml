# World 2 is opened by calc, but the key names a trophy calc does not give.
base = "good"
expect = ["trophy-mismatch"]

[[file]]
path = "w2/world.toml"
text = '''
# The world's words and wiring. Its look lives in code (src/village/areas.ts, terrain.ts).
id = "w2"
order = 2
name = "The Forest"
area = "forest"
regions = { a = "Classes" }

[building]
name = "Cabin"
place = "cabin"

[teacher]
name = "Ranger Noa"
portrait = "ranger"

[key]
boss = "calc"
trophy = "gold-star"
trophy_name = "Gold Star"
opens = "o"
gate_hint = "h"
'''
