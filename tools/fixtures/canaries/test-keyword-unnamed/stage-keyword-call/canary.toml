# The add stage prompt does not name the parameters but its test passes them by keyword (a=, b=).
base = "good"
expect = ["test-keyword-unnamed"]

[[file]]
path = "w1/a/boss/stages/1-add/stage.toml"
text = '''
id = "calc-add"
title = "Add"
prompt = "Write `add` to add two numbers."
hp = 10

[cases]
call = "add"
args = ["int -50..50", "int -50..50"]
'''

[[file]]
path = "w1/a/boss/stages/1-add/tests.py"
text = '''
def test_add():
    expect_equal(learner["add"](a=2, b=3), 5, "add(2, 3)")
'''

