# A second boss, in folder w1/b, also guards region a.
base = "good"
expect = ["boss-region-taken"]

[[file]]
path = "w1/b/boss/boss.md"
text = '''
+++
id = "calc2"
title = "Calculator"
world = "w1"
region = "a"
hard_checks = 3
[trophy]
id = "calc2-trophy"
name = "Calc Trophy"
[hard_trophy]
id = "calc2-gold"
name = "Gold Calc"

[cases]
none = "one() takes no input, so there is nothing to vary"

+++

Build a tiny calculator.
'''

[[file]]
path = "w1/b/boss/starter.py"
text = '''
def one():
    return 0
'''

[[file]]
path = "w1/b/boss/solution.py"
text = '''
def one():
    return 1
'''

