base = "good"
expect = ["right-refused"]

[[file]]
path = "w1/a/basics/tasks/triple/tests.py"
text = '''
def test_triple():
    expect_equal(learner["triple"](2), 6, "triple(2)")

def test_triple_tenth():
    expect_equal(learner["triple"](0.1), 0.3, "triple(0.1)")
'''
