# A hard-mode test expects sub(3, 5) to be 2, which contradicts the stage test, so the boss solution fails hard mode.
base = "good"
expect = ["right-refused"]

[[file]]
path = "w1/a/boss/hard_tests.py"
text = '''
def test_negative():
    expect_equal(learner["sub"](-1, -1), 0, "sub(-1, -1)")

def test_order():
    expect_equal(learner["sub"](3, 5), 2, "sub(3, 5)")
'''
