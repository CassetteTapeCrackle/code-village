# The mul stage reuses the id calc-sub, so two stages share one id.
base = "good"
expect = ["wiring"]

[[file]]
path = "w1/a/boss/stages/3-mul/stage.toml"
text = '''
id = "calc-sub"
title = "Multiply"
prompt = "Write `mul(a, b)`."
hp = 10

[cases]
call = "mul"
args = ["int -50..50", "int -50..50"]
'''

[[file]]
path = "w1/a/boss/ledger.toml"
text = '''
[[sentence]]
fp = "1257fcb833af"
text = "Build a tiny calculator."
where = "boss:intro"
status = "not-a-fact"
decided = "owner"

[[sentence]]
fp = "e9a77978635d"
text = "Write `add(a, b)`."
where = "stage:calc-add:prompt"
status = "not-a-fact"
decided = "owner"

[[sentence]]
fp = "765e4d096d09"
text = "Write `sub(a, b)`."
where = "stage:calc-sub:prompt"
status = "not-a-fact"
decided = "owner"

[[sentence]]
fp = "740c2c34c844"
text = "Write `mul(a, b)`."
where = "stage:calc-sub:prompt"
status = "not-a-fact"
decided = "owner"
'''
