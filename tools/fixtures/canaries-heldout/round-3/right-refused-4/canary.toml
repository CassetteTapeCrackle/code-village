# A half test demands a docstring the prompt never asks for, so right/times-a-half is refused.
base = "good"
expect = ["right-refused"]

[[file]]
path = "w1/a/basics/tasks/half/tests.py"
text = '''
def test_half():
    expect_equal(learner["half"](4), 2.0, "half(4)")

def test_documented():
    if not learner["half"].__doc__:
        raise Failure("half needs a docstring")
'''

[[file]]
path = "w1/a/basics/tasks/half/solution.py"
text = '''
def half(n):
    """Return half of n."""
    return n / 2
'''

