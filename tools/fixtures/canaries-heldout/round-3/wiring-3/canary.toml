# The boss has six stages, but a boss needs three to five.
base = "good"
expect = ["wiring"]

[[file]]
path = "w1/a/boss/stages/4-add-neg/stage.toml"
text = '''
id = "calc-add-neg"
title = "Add negatives"
prompt = "Make `add(a, b)` work for negative numbers."
hp = 10

[cases]
call = "add"
args = ["int -50..50", "int -50..50"]
'''

[[file]]
path = "w1/a/boss/stages/4-add-neg/tests.py"
text = '''
def test_add_negative():
    expect_equal(learner["add"](-2, -3), -5, "add(-2, -3)")
'''

