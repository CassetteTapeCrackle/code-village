# The half task requires a docstring but its prompt never says so; the solution and right answer carry one.
base = "good"
expect = ["ambiguous"]

[[file]]
path = "w1/a/basics/tasks/half/task.toml"
text = '''
id = "basics-half"
concept = "numbers"
kind = "write"
title = "Half it"
prompt = "Write `half(n)`."
hints = ["Divide by 2."]
gotcha = false
requires = ["docstring"]

[cases]
call = "half"
args = ["int -50..50"]
'''

[[file]]
path = "w1/a/basics/tasks/half/solution.py"
text = '''
def half(n):
    """Return half of n."""
    return n / 2
'''

[[file]]
path = "w1/a/basics/tasks/half/right/times-a-half.py"
text = '''
def half(n):
    """Return half of n."""
    return n * 0.5
'''

