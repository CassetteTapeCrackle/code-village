# a hint names round(n), a builtin the vocabulary knows but no lesson teaches
base = "good"
expect = ["progression"]

[[file]]
path = "features.toml"
text = '''
[feature.fn-print]
summary = "print()"
detect = ["call:print"]

[feature.function-def]
summary = "def"
detect = ["node:FunctionDef"]

[feature.return-statement]
summary = "return"
detect = ["node:Return"]

[feature.docstring]
summary = "docstrings"
detect = ["node:Docstring"]
words = ["docstring"]
say = "write a docstring"

[feature.fn-sum]
summary = "sum()"
detect = ["call:sum"]

[feature.fn-round]
summary = "round()"
detect = ["call:round"]
'''

[[file]]
path = "w1/a/basics/tasks/double/task.toml"
text = '''
id = "basics-double"
concept = "numbers"
kind = "write"
title = "Double it"
prompt = "Write `double(n)`."
hints = ["Multiply by 2.", "You do not need `round(n)` here."]
gotcha = true

strict = true

[cases]
call = "double"
args = ["int -50..50"]
'''

[[file]]
path = "w1/a/basics/ledger.toml"
text = '''
