# A predict example prints an f-string, which the vocabulary knows but no lesson teaches.
base = "good"
expect = ["progression"]

[[file]]
path = "features.toml"
text = '''
[feature.fn-print]
summary = "print()"
detect = ["call:print"]

[feature.function-def]
summary = "def"
detect = ["node:FunctionDef"]

[feature.return-statement]
summary = "return"
detect = ["node:Return"]

[feature.fn-sum]
summary = "sum()"
detect = ["call:sum"]

[feature.fstring]
summary = "f-string"
detect = ["node:JoinedStr"]
'''

[[file]]
path = "w1/a/basics/lesson.md"
text = '''
+++
id = "basics"
title = "Basics"
world = "w1"
region = "a"
order = 1
concepts = ["numbers"]
teaches = ["fn-print", "function-def", "return-statement", "fn-sum"]
remember = ["Multiplying by 2 doubles a number."]
[loot]
id = "test-coin"
name = "Test Coin"
+++

Numbers can be multiplied.

```python claim id=times-two
assert 2 * 21 == 42
```

```python example
print(2 * 21)
```

```python predict
print(f"{3 * 3}")
```

::task double

::task half

::task triple
'''
