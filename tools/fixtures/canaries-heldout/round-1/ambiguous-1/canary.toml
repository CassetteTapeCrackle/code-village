# The triple task requires fn-sum, but its prompt never names sum, so a correct n * 3 is refused with no way to know.
base = "good"
expect = ["ambiguous"]

[[file]]
path = "features.toml"
text = '''
[feature.fn-print]
summary = "print()"
detect = ["call:print"]

[feature.function-def]
summary = "def"
detect = ["node:FunctionDef"]

[feature.return-statement]
summary = "return"
detect = ["node:Return"]

[feature.fn-sum]
summary = "sum()"
detect = ["call:sum"]
words = ["sum"]
'''

[[file]]
path = "w1/a/basics/tasks/triple/task.toml"
text = '''
id = "basics-triple"
concept = "numbers"
kind = "write"
title = "Triple it"
prompt = "Write `triple(n)`."
hints = ["Add the number to itself three times."]
requires = ["fn-sum"]
gotcha = false

[cases]
call = "triple"
args = ["int -50..50"]
'''

[[file]]
path = "w1/a/basics/tasks/triple/solution.py"
text = '''
def triple(n):
    return sum([n, n, n])
'''

[[file]]
path = "w1/a/basics/tasks/triple/right/added-three-times.py"
text = '''
def triple(n):
    return sum([n] * 3)
'''

