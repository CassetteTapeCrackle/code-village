# The double test keeps results in a module level list, so a second run of the same tests fails a right answer.
base = "good"
expect = ["right-refused"]

[[file]]
path = "w1/a/basics/tasks/double/tests.py"
text = '''
history = []


def test_four():
    history.append(learner["double"](2))
    expect_equal(history, [4], "double(2)")


def test_zero():
    expect_equal(learner["double"](0), 0, "double(0)")
'''
