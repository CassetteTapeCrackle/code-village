# The sub prompt can mean a - b or b - a; the tests pin a - b.
base = "good"
expect = ["ambiguous"]

[[file]]
path = "w1/a/boss/stages/2-sub/stage.toml"
text = '''
id = "calc-sub"
title = "Subtract"
prompt = "Write `sub(a, b)` to subtract a and b."
hp = 10

[cases]
call = "sub"
args = ["int -50..50", "int -50..50"]
'''

