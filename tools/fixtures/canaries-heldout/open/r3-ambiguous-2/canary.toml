# The half prompt says to round the result but gives no digits and the model answer does not round.
base = "good"
expect = ["ambiguous"]

[[file]]
path = "w1/a/basics/tasks/half/task.toml"
text = '''
id = "basics-half"
concept = "numbers"
kind = "write"
title = "Half it"
prompt = "Write `half(n)` and round the result."
hints = ["Divide by 2."]
gotcha = false

[cases]
call = "half"
args = ["int -50..50"]
'''

