# the quadruple prompt asks to call double twice, a way of writing that Check cannot verify and no feature names
base = "good"
expect = ["ambiguous"]

[[file]]
path = "w1/a/basics/tasks/double/variants/quadruple/variant.toml"
text = '''
id = "basics-double-quadruple"
title = "Four times"
prompt = "Write `quadruple(n)` by calling `double` twice."

[cases]
call = "quadruple"
args = ["int -50..50"]
'''

[[file]]
path = "w1/a/basics/tasks/double/variants/quadruple/starter.py"
text = '''
def double(n):
    return n * 2


def quadruple(n):
    pass
'''

[[file]]
path = "w1/a/basics/tasks/double/variants/quadruple/solution.py"
text = '''
def double(n):
    return n * 2


def quadruple(n):
    return double(double(n))
'''

[[file]]
path = "w1/a/basics/tasks/double/variants/quadruple/right/double-twice.py"
text = '''
def double(n):
    return n + n


def quadruple(n):
    return double(double(n))
'''

