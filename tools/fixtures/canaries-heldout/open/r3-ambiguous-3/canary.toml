# The triple prompt asks the function to print its result too, which no test checks and the right answer skips.
base = "good"
expect = ["ambiguous"]

[[file]]
path = "w1/a/basics/tasks/triple/task.toml"
text = '''
id = "basics-triple"
concept = "numbers"
kind = "write"
title = "Triple it"
prompt = "Write `triple(n)`, which prints the result and also returns it."
hints = ["Multiply by 3."]
gotcha = false

[cases]
call = "triple"
args = ["int -50..50"]
'''

[[file]]
path = "w1/a/basics/tasks/triple/solution.py"
text = '''
def triple(n):
    print(n * 3)
    return n * 3
'''

