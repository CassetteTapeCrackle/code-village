# the claim backing a sentence about float results only asserts equality, which an int would satisfy too
base = "good"
expect = ["false-claim"]

[[file]]
path = "w1/a/basics/lesson.md"
text = '''
+++
id = "basics"
title = "Basics"
world = "w1"
region = "a"
order = 1
concepts = ["numbers"]
teaches = ["fn-print", "function-def", "return-statement", "fn-sum"]
remember = ["Multiplying by 2 doubles a number."]
[loot]
id = "test-coin"
name = "Test Coin"
+++

Numbers can be multiplied.

```python claim id=times-two
assert 2 * 21 == 42
```

Dividing two ints with `/` gives a float.

```python claim id=true-div
assert 4 / 2 == 2
```

```python example
print(2 * 21)
```

```python predict
print(3 * 3)
```

::task double

::task half

::task triple
'''

