# the triple prompt says three times bigger, which reads as 3n or as n + 3n, and the hint no longer settles it
base = "good"
expect = ["ambiguous"]

[[file]]
path = "w1/a/basics/tasks/triple/task.toml"
text = '''
id = "basics-triple"
concept = "numbers"
kind = "write"
title = "Triple it"
prompt = "Write `triple(n)` so that it returns a number three times bigger than `n`."
hints = ["Check your answer with a small number."]
gotcha = false

[cases]
call = "triple"
args = ["int -50..50"]
'''

