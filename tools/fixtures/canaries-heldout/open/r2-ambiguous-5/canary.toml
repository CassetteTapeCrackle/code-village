# the sub stage prompt says the difference of a and b, which can be a minus b, b minus a or the absolute gap
base = "good"
expect = ["ambiguous"]

[[file]]
path = "w1/a/boss/stages/2-sub/stage.toml"
text = '''
id = "calc-sub"
title = "Subtract"
prompt = "Write `sub(a, b)` so that it returns the difference of `a` and `b`."
hp = 10

[cases]
call = "sub"
args = ["int -50..50", "int -50..50"]
'''

