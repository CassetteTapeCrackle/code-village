# The triple hint tells learners to define thrice(n) while the prompt and tests say triple.
base = "good"
expect = ["ambiguous"]

[[file]]
path = "w1/a/basics/tasks/triple/task.toml"
text = '''
id = "basics-triple"
concept = "numbers"
kind = "write"
title = "Triple it"
prompt = "Write `triple(n)`."
hints = ["Define `thrice(n)` and multiply by 3."]
gotcha = false

[cases]
call = "triple"
args = ["int -50..50"]
'''

[[file]]
path = "w1/a/basics/ledger.toml"
text = '''
[[sentence]]
fp = "5200066b97e8"
text = "Numbers can be multiplied."
where = "text:0"
status = "claim:times-two"
decided = "owner"

[[sentence]]
fp = "66ec437924e8"
text = "Write `double(n)`."
where = "task:basics-double:prompt"
status = "not-a-fact"
decided = "owner"

[[sentence]]
fp = "a82bdae3baef"
text = "Multiply by 2."
where = "task:basics-double:hint:0"
status = "not-a-fact"
decided = "owner"

[[sentence]]
fp = "f534e12368ba"
text = "Write `quadruple(n)`."
