# Keeps actions and npm dependencies current with one grouped pull request a week.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev # main only takes finished releases from dev
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      # the worker tests run vitest inside Cloudflare's pool, which supports only some vitest versions: move them together
      vitest:
        patterns: ["vitest", "@vitest/*", "@cloudflare/vitest-plugin"]
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
