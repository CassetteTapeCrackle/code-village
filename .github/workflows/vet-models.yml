# Runs the model jobs of the content test framework (docs inventory, DeepSeek reviews, blind solvers) and uploads
# what they produce as the artifact vet-model-results. A cloud session starts a job by pushing a request file to
# vet/requests/ on test-framework: GitHub starts a workflow from the API only when the workflow file is on the
# default branch. After the merge, run it by hand with the request path. A session downloads the artifact with the
# REST API and commits the results; this job pushes nothing (a push by the Actions token starts no CI).
name: Vet models

on:
  push:
    branches: [test-framework]
    paths: ["vet/requests/**"]
  workflow_dispatch:
    inputs:
      request:
        description: "Request file to run, for example vet/requests/sentences-sample.json"
        required: true

permissions:
  contents: read

concurrency:
  group: vet-models-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.9"
      - name: Run the requests
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          REQUEST: ${{ inputs.request }}
          # the repository secret is named DSKEY; the code reads it as DEEPSEEK_API_KEY
          DEEPSEEK_API_KEY: ${{ secrets.DSKEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
        run: |
          set -eu
          case "${REQUEST:-}" in
            "") ;;
            *..* | -*) echo "the request must be a vet/requests/*.json file"; exit 1 ;;
            vet/requests/[A-Za-z0-9_.]*.json) ;;
            *) echo "the request must be a vet/requests/*.json file"; exit 1 ;;
          esac
          if [ -n "${REQUEST:-}" ]; then
            printf '%s\0' "$REQUEST" > requests.list
          elif [ "${BEFORE#0000000}" != "$BEFORE" ]; then
            find vet/requests -maxdepth 1 -name '*.json' -print0 > requests.list
          else
            git diff -z --name-only --diff-filter=AM "$BEFORE" "$SHA" -- 'vet/requests/*.json' > requests.list
          fi
          [ -s requests.list ] || { echo "no request file in this push"; exit 1; }
          mkdir -p out
          while IFS= read -r -d '' file; do
            echo "== $file"
            python -m tools.vet.models.request "$file" --out "out/$(basename "$file" .json)"
          done < requests.list
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vet-model-results
          path: out/
          if-no-files-found: error
