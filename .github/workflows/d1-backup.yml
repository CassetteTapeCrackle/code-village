# Copies the game's D1 database (all player data) each night into the private repo
# CassetteTapeCrackle/code-village-backups. Time Travel on the Free plan reaches back 7 days only; this covers losing
# the Cloudflare account, or a problem found later than that. The dump is one plain SQL file, code-village.sql,
# overwritten each night: each commit stays a small diff and the history keeps every night.
#
# This repo is public, so the dump never lands in it: no artifact, no cache, no log line. wrangler prints a link to
# the export that downloads it without a login for an hour, so its output goes to a file that is never shown whole.
#
# Restore, from the root of this repo:
# - Within 7 days, Time Travel first, in place:
#     pnpm exec wrangler d1 time-travel restore code-village --timestamp <RFC 3339 time> --config worker/wrangler.jsonc
# - Older, or the database is gone: create an empty database (pnpm exec wrangler d1 create code-village), put its id
#   in worker/wrangler.jsonc, take code-village.sql from the night you want in code-village-backups, then
#     pnpm exec wrangler d1 execute code-village --remote --file code-village.sql --config worker/wrangler.jsonc
#   Apply no migrations first: the dump holds the schema and the d1_migrations table that records them.
name: D1 backup

on:
  # away from CI's 03:17, and while players sleep: the database answers no queries during the export
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# two runs must not push to the backup repo at once
concurrency:
  group: d1-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      # first, so a missing or wrong token fails before the export makes the database unavailable
      - name: Clone the backup repo
        env:
          BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
        run: |
          if [ -z "$BACKUP_REPO_TOKEN" ]; then
            echo "::error::The production environment has no BACKUP_REPO_TOKEN secret. Create a fine-grained token with Contents: read and write on code-village-backups only, add it, then re-run."
            exit 1
          fi
          repo="github.com/CassetteTapeCrackle/code-village-backups.git"
          git clone --depth 1 --quiet "https://x-access-token:${BACKUP_REPO_TOKEN}@${repo}" "$RUNNER_TEMP/backups"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # no pnpm cache, as in deploy.yml: the store could have been saved by a job that ran the build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - run: pnpm install --frozen-lockfile
      # the dump goes outside the workspace; wrangler's log holds the download link, so it is shown only on failure,
      # with links removed
      - name: Export the database
        run: |
          dump="$RUNNER_TEMP/code-village.sql"
          if ! pnpm exec wrangler d1 export code-village --remote --skip-confirmation --output "$dump" \
            --config worker/wrangler.jsonc >"$RUNNER_TEMP/export.log" 2>&1; then
            sed -E 's#https?://[^[:space:]]+#[link removed]#g' "$RUNNER_TEMP/export.log"
            echo "::error::wrangler d1 export failed (its output is above, links removed)."
            exit 1
          fi
          if ! grep -q "CREATE TABLE" "$dump"; then
            echo "::error::The export is empty (no CREATE TABLE in it), so nothing is pushed."
            exit 1
          fi
          # shortcut: GitHub refuses files over 100 MB; if this nears it, split the dump by --table
          echo "Exported $(du -h "$dump" | cut -f1)."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Push the dump to the backup repo
        run: |
          mv "$RUNNER_TEMP/code-village.sql" "$RUNNER_TEMP/backups/code-village.sql"
          cd "$RUNNER_TEMP/backups"
          git add code-village.sql
          if git diff --cached --quiet; then
            echo "Nothing changed since the last backup."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "Backup $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push --quiet origin HEAD
