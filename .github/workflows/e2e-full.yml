# The full browser sweep: every task and boss through e2e/generated*.spec.ts, in four shards. A pull request runs only the
# items it changes (ci.yml); this runs on manual dispatch and on pushes to main. While the repository is private on
# GitHub Free it shares the 2000 Actions minutes a month, so it is kept off pushes to dev. Public repositories or Pro
# accounts can add `dev` to the branches below.
name: E2E full

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      VET_ITEMS: all
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.9"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - id: playwright
        run: echo "version=$(grep -oE '@playwright/test@[0-9]+\.[0-9]+\.[0-9]+' pnpm-lock.yaml | head -1 | cut -d@ -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright.outputs.version }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/pyodide-wheels
          key: pyodide-wheels-${{ hashFiles('node_modules/pyodide/package.json') }}
      - run: pnpm exec playwright install --with-deps chromium
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .vet-cache
            !.vet-cache/py3.*
            !.vet-cache/pyodide-jobs.json
          key: vet-cache-e2e-full-${{ github.run_id }}
          restore-keys: vet-cache-
      - run: pnpm content --quick --items-out .vet-cache/e2e-items.json
      - run: pnpm e2e e2e/generated --shard=${{ matrix.shard }}/4
        env:
          E2E_NO_PREVIEW: "1"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-full-results-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
