# Ships the Worker after CI passed on main. Deploys use workflow_run (rather than a push trigger) because
# it guarantees the tested SHA is the one that deploys: GitHub only starts this workflow once CI has
# finished, and the job checks the conclusion.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    # this runs for completed CI runs; the push guard below is what keeps deploys to real main merges
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # two merges in a row must not race: queued deploys finish in order, so the newest commit lands last
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      # re-running an old successful CI run would redeploy an old commit: only the tip of main deploys
      - name: Check this is still the tip of main
        id: fresh
        run: |
          current=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          if [ "$current" = "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "This deploy is for ${{ github.event.workflow_run.head_sha }}; main is $current now, so nothing is deployed."
          fi
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      # pnpm build runs the content check, which needs uv and the World 3 libraries
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/pyodide-wheels
          key: pyodide-wheels-${{ hashFiles('node_modules/pyodide/package.json') }}
      - run: pnpm build
        if: steps.fresh.outputs.fresh == 'true'
        env:
          # the public Turnstile site key the widget renders with; a repository variable, not a secret
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      # The Cloudflare secrets reach only the wrangler steps, never pnpm install or pnpm build, which
      # run PyPI wheels.
      # migrations land before the code that expects them, once, from main only
      - if: steps.fresh.outputs.fresh == 'true'
        run: pnpm exec wrangler d1 migrations apply code-village --remote --config worker/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - if: steps.fresh.outputs.fresh == 'true'
        run: pnpm exec wrangler deploy --config worker/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
