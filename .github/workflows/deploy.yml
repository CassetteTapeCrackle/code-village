# Ships the Worker after CI passed on main. Deploys use workflow_run (rather than a push trigger) because
# it guarantees the tested SHA is the one that deploys: GitHub only starts this workflow once CI has
# finished, and the job checks the conclusion.
#
# Two jobs, so the Cloudflare token never shares a machine with the build. `pnpm build` runs code from
# hundreds of npm packages and PyPI wheels, and one bad release could rewrite node_modules/wrangler on disk
# before a later step ran it with the token. The deploy job starts clean: it installs from the lockfile with
# no cache, runs no package scripts but the allowed ones, and only bundles and uploads what the build made.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# two merges in a row must not race: queued runs finish in order, so the newest commit lands last
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    # this runs for completed CI runs; the push guard below is what keeps deploys to real main merges
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      fresh: ${{ steps.fresh.outputs.fresh }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      # re-running an old successful CI run would redeploy an old commit: only the tip of main deploys
      - name: Check this is still the tip of main
        id: fresh
        run: |
          current=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          if [ "$current" = "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "This deploy is for ${{ github.event.workflow_run.head_sha }}; main is $current now, so nothing is deployed."
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.fresh.outputs.fresh == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.fresh.outputs.fresh == 'true'
        with:
          node-version: lts/*
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.fresh.outputs.fresh == 'true'
        with:
          python-version: "3.14"
      # pnpm build runs the content check, which needs uv and the World 3 libraries
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: steps.fresh.outputs.fresh == 'true'
      - if: steps.fresh.outputs.fresh == 'true'
        run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.fresh.outputs.fresh == 'true'
        with:
          path: node_modules/.cache/pyodide-wheels
          key: pyodide-wheels-${{ hashFiles('node_modules/pyodide/package.json') }}
      - if: steps.fresh.outputs.fresh == 'true'
        run: pnpm build
        env:
          # the public Turnstile site key the widget renders with; a repository variable, not a secret
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      # the site, and the generated content bundle the Worker imports (git-ignored, so the checkout lacks it)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.fresh.outputs.fresh == 'true'
        with:
          name: site
          path: |
            dist/
            src/content/bundle.json
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    if: needs.build.outputs.fresh == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # no pnpm cache: the store could have been saved by a job that ran the build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
      # a Worker without its secrets fails sign-up and recovery: stop before shipping it
      - name: Check the Worker's secrets are set
        run: |
          secrets=$(pnpm exec wrangler secret list --config worker/wrangler.jsonc)
          for name in TURNSTILE_SECRET IP_SALT RECOVERY_KEY; do
            if ! grep -q "\"$name\"" <<<"$secrets"; then
              echo "::error::The Worker has no $name secret. Add it in the Cloudflare dashboard, then re-run this deploy."
              exit 1
            fi
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # migrations land before the code that expects them, once, from main only
      - run: pnpm exec wrangler d1 migrations apply code-village --remote --config worker/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: pnpm exec wrangler deploy --config worker/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
