# Checks every pull request and every push to main or dev: lint, formatting, unit, Python, Worker and browser tests.
# The check job runs every content rule. Pull requests and dev reuse .vet-cache; main, manual runs and the nightly
# run compute everything afresh, so a result the cache key should have invalidated is caught within a day.
name: CI

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # exact: runner images differ in their 3.14 patch, and the content check's cache key holds sys.version
          python-version: "3.14.9"
      # the content check runs World 3 with NumPy, pandas and scikit-learn through uv
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: pnpm install --frozen-lockfile
      # the library wheels the app serves, fetched once per Pyodide version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/pyodide-wheels
          key: pyodide-wheels-${{ hashFiles('node_modules/pyodide/package.json') }}
      # mutation, rewrite and right/ results per item: each file records the hash of the code, pins and Python it
      # was computed under (tools/vet/cache.py), so the latest cache is restored whatever changed since. The older
      # Pythons' environments are left out: uv rebuilds them in seconds, and they would fill the cache quota
      - if: github.event_name == 'pull_request' || github.ref == 'refs/heads/dev'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .vet-cache
            !.vet-cache/py3.*
            !.vet-cache/pyodide-jobs.json
          key: vet-cache-${{ github.run_id }}
          restore-keys: vet-cache-
      - run: pnpm lint
      - run: pnpm lint:py
      - run: pnpm typecheck:py
      - run: pnpm exec prettier --check .
      # pnpm test generates src/content/bundle.json (git-ignored), which svelte-check reads, so it runs first
      - run: pnpm test
      # every runtime verdict of pnpm test, repeated in Pyodide (the browser's Python) through the same harness
      - run: pnpm vet:pyodide
        timeout-minutes: 15
      # a pull request may add vet/gaps.toml entries only for a rule it introduces
      - if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          python -m tools.vet.gaps --base "origin/$BASE_REF"
      - run: pnpm typecheck
      # the root tsconfig excludes worker/, so its types need their own pass
      - run: pnpm typecheck:worker
      - run: pnpm test:py
      - run: pnpm test:worker
      - run: pnpm build

  # GitHub secret scanning is off for a private repo on GitHub Free, so gitleaks scans the whole history here
  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: |
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks
          rm gitleaks.tar.gz
      - run: '"$RUNNER_TEMP/gitleaks" git --redact --config .gitleaks.toml'

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # exact: runner images differ in their 3.14 patch, and the content check's cache key holds sys.version
          python-version: "3.14.9"
      # pnpm e2e builds the site and runs the content check, both through uv
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      # browsers change with the Playwright version pinned in the lockfile
      - id: playwright
        run: echo "version=$(grep -oE '@playwright/test@[0-9]+\.[0-9]+\.[0-9]+' pnpm-lock.yaml | head -1 | cut -d@ -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright.outputs.version }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/pyodide-wheels
          key: pyodide-wheels-${{ hashFiles('node_modules/pyodide/package.json') }}
      - run: pnpm exec playwright install --with-deps chromium
      # the quick build (the check job runs every rule); built here so the dev server's start stays short
      - run: pnpm content --quick
      - run: pnpm e2e $(git ls-files 'e2e/*.spec.ts' | grep -v generated)
      # always: the report and traces are the evidence this job exists to collect, success or failure
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # The specs built from the content (e2e/generated*.spec.ts) for the items a pull request changes plus a sample, in
  # shards so each stays short whatever VET_ITEMS picks. The full sweep is e2e-full.yml.
  generated:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # exact: runner images differ in their 3.14 patch, and the content check's cache key holds sys.version
          python-version: "3.14.9"
      # pnpm e2e builds the site and runs the content check, both through uv
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      # browsers change with the Playwright version pinned in the lockfile
      - id: playwright
        run: echo "version=$(grep -oE '@playwright/test@[0-9]+\.[0-9]+\.[0-9]+' pnpm-lock.yaml | head -1 | cut -d@ -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright.outputs.version }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/pyodide-wheels
          key: pyodide-wheels-${{ hashFiles('node_modules/pyodide/package.json') }}
      - run: pnpm exec playwright install --with-deps chromium
      # the mutation results of the check job, so the items file can name a mutant only the hidden cases kill
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .vet-cache
            !.vet-cache/py3.*
            !.vet-cache/pyodide-jobs.json
          key: vet-cache-e2e-${{ github.run_id }}
          restore-keys: vet-cache-
      # the quick build (the check job runs every rule); built here so the dev server's start stays short. It also
      # writes the items the generated specs (e2e/generated*.spec.ts) cover
      - run: pnpm content --quick --items-out .vet-cache/e2e-items.json
      # a pull request runs the generated specs only for the items it changes plus a fixed sample; the full sweep is
      # e2e-full.yml (manual, and on pushes to main)
      - name: Choose the generated items
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            items=$(python -m tools.vet.changed --base "origin/$BASE_REF")
            # a change to the generated specs asks for everything, which is the full sweep's job (e2e-full.yml)
            case ",$items," in *,all,*) items=sample ;; esac
          else
            items=sample
          fi
          echo "VET_ITEMS=$items" >> "$GITHUB_ENV"
          echo "generated browser tests cover: $items" >> "$GITHUB_STEP_SUMMARY"
      - run: pnpm e2e e2e/generated --shard=${{ matrix.shard }}/4
        env:
          E2E_NO_PREVIEW: "1"
      # always: the report and traces are the evidence this job exists to collect, success or failure
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-results-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
