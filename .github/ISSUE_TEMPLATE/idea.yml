name: Idea
description: Something you would like the village to have or do.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?
      description: Who it is for, and what it would make easier or more fun.
