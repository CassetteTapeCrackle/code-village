# Everything code can use that a lesson can teach. A lesson lists the ids it teaches in `teaches` (front matter);
# code in a lesson, task, hint or boss may use only what that lesson or an earlier one teaches.
# detect: node:<AstClass>, call:<builtin>, method:<name>, import:<module>, decorator:<name>, kwarg:<call>.<name>
# words: how a task prompt names a construct it requires (matched in the prompt, lower case)
# Code that uses a builtin call, method call, import, decorator or tracked syntax listed nowhere here fails the
# build as unknown-feature: add it here, then to the `teaches` of the lesson that introduces it.

# Syntax
[feature.for-loop]
summary = "for loops"
detect = ["node:For"]
words = ["for loop"]

[feature.while-loop]
summary = "while loops"
detect = ["node:While"]
words = ["while loop"]

[feature.break-continue]
summary = "break and continue"
detect = ["node:Break", "node:Continue"]

[feature.if-statement]
summary = "if, elif and else"
detect = ["node:If"]

[feature.conditional-expression]
summary = "a if condition else b"
detect = ["node:IfExp"]
words = ["conditional expression", "one-line if"]

[feature.match-statement]
summary = "match and case"
detect = ["node:Match"]
words = ["match statement"]

[feature.function-def]
summary = "def"
detect = ["node:FunctionDef"]

[feature.return-statement]
summary = "return"
detect = ["node:Return"]

[feature.lambda]
summary = "lambda expressions"
detect = ["node:Lambda"]
words = ["lambda"]

[feature.class-def]
summary = "class"
detect = ["node:ClassDef"]

[feature.try-except]
summary = "try, except, else and finally"
detect = ["node:Try"]
words = ["try/except", "try and except", "try block"]

[feature.raise-statement]
summary = "raise"
detect = ["node:Raise"]

[feature.assert-statement]
summary = "assert"
detect = ["node:Assert"]

[feature.with-statement]
summary = "with"
detect = ["node:With"]
words = ["with statement", "with block"]

[feature.global-nonlocal]
summary = "global and nonlocal"
detect = ["node:Global", "node:Nonlocal"]
words = ["global statement", "nonlocal"]

[feature.generator-yield]
summary = "yield and yield from"
detect = ["node:Yield", "node:YieldFrom"]
words = ["yield"]

[feature.unpack-star]
summary = "starred unpacking, *rest and *args"
detect = ["node:Starred"]
words = ["starred", "*args"]

[feature.list-comprehension]
summary = "list comprehensions"
detect = ["node:ListComp"]
words = ["list comprehension", "comprehension"]

[feature.set-comprehension]
summary = "set comprehensions"
detect = ["node:SetComp"]
words = ["set comprehension"]

[feature.dict-comprehension]
summary = "dict comprehensions"
detect = ["node:DictComp"]
words = ["dict comprehension"]

[feature.generator-expression]
summary = "generator expressions"
detect = ["node:GeneratorExp"]
words = ["generator expression"]

[feature.f-string]
summary = "f-strings"
detect = ["node:JoinedStr"]
words = ["f-string"]

[feature.augmented-assignment]
summary = "+=, -= and the other augmented assignments"
detect = ["node:AugAssign"]
words = ["augmented assignment"]

[feature.slicing]
summary = "slices such as items[1:3]"
detect = ["node:Slice"]
words = ["slice", "slicing"]

[feature.delete]
summary = "del"
detect = ["node:Delete"]

[feature.walrus]
summary = "the := operator"
detect = ["node:NamedExpr"]
words = ["walrus"]

