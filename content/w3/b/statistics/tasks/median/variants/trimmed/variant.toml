id = "statistics-trimmed"
title = "Mean without the extremes"
prompt = "Write `trimmed_mean(values)` by hand (no NumPy): drop one smallest and one largest value, and return the mean of the rest. There are always at least 3 values."

[cases]
call = "trimmed_mean"
args = ["list<int -20..20> 3..9"]
compare = "float"
