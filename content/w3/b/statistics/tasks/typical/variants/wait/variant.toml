id = "statistics-wait"
title = "A typical wait"
prompt = "`typical_wait(minutes)` should return the typical wait at the cable car: the middle value once sorted, so one very long wait does not drag it. It uses the mean instead: find and fix the bug."

[cases]
call = "typical_wait"
args = ["list<int 0..90> 1..9"]
compare = "float"
