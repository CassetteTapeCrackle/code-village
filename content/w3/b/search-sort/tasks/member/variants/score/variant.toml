id = "search-sort-score"
title = "Find the score"
prompt = "`has_score(scores, s)` uses a binary search to say whether `s` is in `scores`. For `[90, 20, 70, 40]` and `90` it says `False`: find and fix the bug. (A binary search needs sorted data.)"

[cases]
call = "has_score"
args = ["list<int 0..99> 0..10", "int 0..99"]
