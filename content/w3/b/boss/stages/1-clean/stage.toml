prompt = "`clean(rows)` gets strings like `\"06:00,12\"` (an hour and a wind speed) and returns the speeds as plain floats, in order. Skip a row whose speed is blank or not a number (`float()` raises `ValueError` then), and when an hour comes twice, keep only its first usable reading."
