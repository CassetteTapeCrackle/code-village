id = "numpy-arrays-fahrenheit"
title = "Degrees for visitors"
prompt = "Write `to_fahrenheit(celsius)`: it returns a NumPy array of the temperatures in the list `celsius`, each turned into Fahrenheit with `c * 9 / 5 + 32`."

