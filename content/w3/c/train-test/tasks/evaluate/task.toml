id = "train-test-evaluate"
concept = "train-test"
kind = "complete"
title = "Split, fit, score"
prompt = "Finish `evaluate(X, y)`: split `X` and `y` with `test_size=0.25` and `random_state=0`, fit a 1-neighbour model on the training part, and return its score on the test part as a plain float. The split line is missing."
hints = ["`train_test_split` returns four lists: train inputs, test inputs, train labels, test labels.", "Pass the test size and random state from the prompt, and unpack the four results in the order the next lines use."]
gotcha = false

[cases]
call = "evaluate"
args = ["list<list<float 0.0..10.0> 2..2> 8..8", "list<choice a|b> 8..8"]
compare = "float"
