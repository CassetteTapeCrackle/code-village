id = "knn-sklearn-k"
title = "Choose the k"
prompt = "Finish `crowd(X, y, new_rows)`: make a `KNeighborsClassifier` where 5 neighbours vote, fit it on `X` and `y`, and return a plain list of labels for `new_rows`."

[cases]
call = "crowd"
args = ["list<list<float 0.0..10.0> 2..2> 6..6", "list<choice a|b> 6..6", "list<list<float 0.0..10.0> 2..2> 1..4"]
