id = "functions-as-values-keep-long"
concept = "functions-as-values"
kind = "complete"
title = "Only the long words"
prompt = "Finish `long_words(words, n)`: it returns a list of the words longer than `n` letters, in their order, using `filter` and a `lambda`."
hints = ["The lambda gets one word and answers `True` or `False`.", "`list(filter(lambda w: w.startswith(\"a\"), words))` keeps the words starting with a."]
gotcha = false

[cases]
call = "long_words"
args = ["list<word> 0..8", "int 0..8"]
