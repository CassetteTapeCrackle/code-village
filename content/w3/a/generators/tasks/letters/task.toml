id = "generators-letters"
concept = "generators"
kind = "complete"
title = "Count the letters"
prompt = "Finish `total_letters(words)`: it returns how many letters all the words have together, with `sum` over a generator expression."
hints = ["Inside `sum(...)`, write `len(w)` for each `w` in `words`.", "`sum(len(w) for w in [\"hi\", \"there\"])` is 7; use the same shape on `words`."]
gotcha = false
requires = ["generator-expression"]

[cases]
call = "total_letters"
args = ["list<word> 0..8"]
