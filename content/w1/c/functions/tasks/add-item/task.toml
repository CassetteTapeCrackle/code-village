id = "functions-add-item"
concept = "functions"
kind = "fix"
title = "A fresh bag each time"
prompt = "`add_item(item, items)` adds `item` to `items` and returns the list. When no list is given it should start a **new** empty list every time. Right now the second call remembers the first. Find and fix the bug."
hints = ["Call `add_item(\"tea\")` then `add_item(\"jam\")` and print both results.", "Use `None` as the default in the `def`, then inside the function check for `None` and make a fresh empty list."]
gotcha = true

[cases]
call = "add_item"
args = ["word", "optional<list<word> 0..4>"]
