id = "dicts-in-both"
title = "In both lists"
prompt = "Finish `in_both(a, b)`: it returns a sorted list of the values found in both lists, each only once. `x in b` checks a list too, and `x not in both` is its opposite."

[cases]
call = "in_both"
args = ["list<int 0..9> 0..8", "list<int 0..9> 0..8"]
