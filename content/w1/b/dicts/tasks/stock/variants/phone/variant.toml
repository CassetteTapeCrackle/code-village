id = "dicts-phone"
title = "The phone book"
prompt = "`phone(book, name)` should return the number stored for `name`, and `\"unknown\"` for a name that is not in the book. It crashes on new names: find and fix the bug."

[cases]
call = "phone"
args = ["dict<choice ann|bo|cy|di, int 1000..9999> 0..4", "choice ann|bo|cy|di|ed"]
