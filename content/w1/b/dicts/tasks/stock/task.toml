id = "dicts-stock"
concept = "dicts"
kind = "fix"
title = "What is left?"
prompt = "`in_stock(stock, item)` should return how many of `item` are left, and 0 for an item the shop has never had. It has a bug: find and fix it."
hints = ["Try it with an item that is not in the dict.", "`menu.get(\"tea\", 0)` gives 0 when the key is missing."]
gotcha = true

[cases]
call = "in_stock"
args = ["dict<choice ann|bo|cy|di, int 0..20> 0..4", "choice ann|bo|cy|di|ed"]
