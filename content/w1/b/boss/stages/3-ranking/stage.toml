id = "gradebook-ranking"
title = "The ranking"
prompt = "`ranking(lines)` returns `(name, average)` pairs, best average first. Equal averages are in alphabetical order. Blank lines (empty or only spaces) are skipped, and the list it is given stays as it was. Tip: `sorted(pairs, key=lambda pair: (-pair[1], pair[0]))` sorts by average, highest first, then by name. `lambda pair: ...` is a tiny one-line function, and the minus sign flips the order."
hp = 40
construct_words_ok = "the prompt offers the sorted call as a tip; any way to order the pairs is right"

[cases]
none = "it takes gradebook lines, which mix a name, a colon and commas that a case cannot build"
