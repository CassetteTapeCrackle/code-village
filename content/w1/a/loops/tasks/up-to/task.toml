id = "loops-up-to"
concept = "loops"
kind = "fix"
title = "Up to and including"
prompt = "`up_to(n)` should return the list `[1, 2, ..., n]`. It has a bug: find and fix it."
hints = ["Print `list(range(1, 3))`: is 3 in it?", "`range` stops before its end value, so the stop has to be one past the last number you want."]
