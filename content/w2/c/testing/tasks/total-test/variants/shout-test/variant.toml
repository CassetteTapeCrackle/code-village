id = "testing-shout-test"
title = "Another test that cannot fail"
prompt = "`test_shout()` passes even when `shout` is broken. Fix the test, not `shout`: an `assert` with brackets around both parts checks a pair, and a pair is always true."

[cases]
none = "the learner writes the test function, which takes no input a case could vary"
# checked by hand: each is still a test that catches every bug the prompt names (a change to the given
# code is not the learner's work, and the task judges only their test)
equivalent = [
  "cmp-swap:6:4 (line 6: `shout(\"hey\") == \"HEY!\"` became `shout('hey') >= 'HEY!'`)",
]
