id = "inheritance-bat"
title = "A bat with no name"
prompt = "`Bat(name, wingspan)` should be an `Animal` with a `name` and a `wingspan`, but asking for its name raises `AttributeError`: find and fix it. The child's `__init__` must call `super().__init__(name)`."
requires = ["fn-super"]

[cases]
none = "it only stores what it is given, and the visible tests read each attribute"
