id = "composition-ranger-pack"
concept = "composition"
kind = "fix"
title = "A ranger is not a backpack"
prompt = "A `Ranger` should **have** a `Backpack` called `pack`, so `ranger.pack.add(\"rope\")` works. Right now a ranger **is** a backpack, so it has no `pack` at all: fix the design."
hints = ["Drop the inheritance: define the class on its own, with no parent in the parentheses.", "In `__init__`, store the name on `self` and create a new `Backpack()` as `self.pack`."]
gotcha = true

[cases]
none = "the point is the Backpack object held in an attribute, which a case cannot read"
