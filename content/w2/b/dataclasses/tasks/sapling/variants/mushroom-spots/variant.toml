id = "dataclasses-mushroom-spots"
title = "A spotty mushroom"
prompt = "Write a dataclass `Toadstool` with fields `name` (str) and `spots` (int, default 0), and a method `add_spot()` that adds 1 to `spots`. Start with `from dataclasses import dataclass` and put `@dataclass` above the class."
requires = ["dataclass-decorator"]

[cases]
class = "Toadstool"
init = ["word", "int 0..5"]
methods = { add_spot = [] }
reads = ["name", "spots"]
