id = "dataclasses-sapling"
concept = "dataclasses"
kind = "write"
title = "A growing sapling"
prompt = "Write a dataclass `Sapling` with fields `name` (str) and `height` (int, default 1), and a method `grow(cm)` that adds `cm` to `height`. `repr(Sapling(\"oak\"))` should be `Sapling(name='oak', height=1)`."
hints = ["Import the decorator from `dataclasses`, put it above the class, and list the fields in the class body.", "Fields with defaults use `name: type = value`. In `grow`, add the argument to the height attribute on `self`."]
gotcha = false

strict = true

[cases]
class = "Sapling"
init = ["word"]
methods = { grow = ["int 1..50"] }
reads = ["name", "height"]
