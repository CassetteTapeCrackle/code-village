id = "identity-maps"
title = "The same map?"
prompt = "Write `compare_maps(a, b)` for two `Map` objects (each has a `region`): `\"same map\"` if they are the very same object, `\"copies\"` if they are different objects of the same region, `\"different\"` otherwise."

[cases]
none = "it takes objects of the learner's own classes, which a case cannot make"
