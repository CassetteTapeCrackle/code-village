id = "class-attributes-lanterns"
title = "How many lanterns?"
prompt = "Finish `Lantern`: the class attribute `made` starts at 0, and every new lantern should add 1 to it. Change it through the class: `Lantern.made += 1`."

[cases]
none = "the counter lives on the class and grows with every object, so a case cannot compare it"
