id = "class-attributes-cabin"
concept = "class-attributes"
kind = "write"
title = "Room in the cabin"
prompt = "Write a class `Cabin` with a class attribute `capacity = 4`. `Cabin(name)` stores `name` and its own empty `guests` list. `check_in(guest)` adds the guest and returns `True` while there is room, otherwise returns `False` without adding."
hints = ["Which value is shared by every cabin, and which one belongs to each cabin?", "Inside `check_in`, compare `len()` of `self.guests` with `self.capacity`. If there is room, append the guest and return `True`; otherwise return `False`."]
gotcha = false

[cases]
class = "Cabin"
init = ["word"]
methods = { check_in = ["word"] }
reads = ["name", "guests"]
